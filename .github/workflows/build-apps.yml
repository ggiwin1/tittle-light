name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["desktop-app/**", ".github/workflows/build-apps.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: TittleLight-Windows
            file: TittleLight-Windows.zip
          - os: macos-latest          # Apple Silicon Macs
            artifact: TittleLight-Mac-AppleSilicon
            file: TittleLight-Mac-AppleSilicon.zip
          - os: macos-15-intel        # Intel Macs
            artifact: TittleLight-Mac-Intel
            file: TittleLight-Mac-Intel.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip wheel pillow pystray
      - name: Install PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: python -m pip install pyinstaller
      - name: Install PyInstaller with a freshly compiled bootloader (Windows)
        # Antivirus tools often flag the stock PyInstaller bootloader because malware reuses it.
        # Compiling our own bootloader and shipping a folder (not a self-extracting one-file exe)
        # avoids most of those false alarms.
        if: runner.os == 'Windows'
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: python -m pip install --no-binary pyinstaller pyinstaller
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name TittleLight --icon icon.png --paths . --hidden-import tittle_image --hidden-import pystray._win32 --add-data "icon.png;." tittle_desktop.py
          cd dist && 7z a -tzip "${{ matrix.file }}" TittleLight
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --name TittleLight --icon icon.png \
            --osx-bundle-identifier com.claudeandchad.tittlelight --paths . --hidden-import tittle_image tittle_desktop.py
          cd dist && ditto -c -k --keepParent TittleLight.app "${{ matrix.file }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop-app/dist/${{ matrix.file }}

  release:
    # Every build on main (and every v* tag) publishes a GitHub release named after APP_VERSION
    # in desktop-app/tittle_desktop.py, with the Windows and Mac apps attached.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the app version
        id: ver
        run: echo "version=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' desktop-app/tittle_desktop.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: apps
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.ver.outputs.version }}" '/^## /{p=($2==v); next} p' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ### Download
          - **Windows:** download `TittleLight-Windows.zip`, right-click it and choose Extract All, open the `TittleLight` folder and double-click `TittleLight.exe`. If Windows says "Windows protected your PC", click More info, then Run anyway.
          - **Mac:** download the Apple Silicon or Intel zip, unzip it, then right-click `TittleLight.app` and choose Open the first time (the app isn't signed).
          - Prefer Python? `desktop-app/tittle_desktop.py` in the source code is the same app.
          NOTES
          sed -i 's/^          //' notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Tittle Light ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: apps/*
          body_path: notes.md
